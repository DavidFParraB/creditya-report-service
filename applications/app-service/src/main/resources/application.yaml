server:
  port: 8080
spring:
  application:
    name: "credit-application"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
    active: "local"
aws:
  region: "us-east-2"
  dynamodb:
    endpoint: "https://dynamodb.us-east-2.amazonaws.com"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
entrypoint:
  sqs:
    region: "us-east-2"
    endpoint: "https://sqs.us-east-2.amazonaws.com"
    queueUrl: "https://sqs.us-east-2.amazonaws.com/817100478616/SQSLoanReport"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
